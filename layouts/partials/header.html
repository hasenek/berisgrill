{{- $s := site.Data.site -}}
{{- $logo := partial "resize.html" (dict "path" "img/logo.jpg" "width" 200) -}}
<header class="site-head">
  <a class="brand" href="{{ "/" | relURL }}">
    {{ with $logo }}<img class="brand-logo" src="{{ . }}" alt="{{ $s.business_name }}">{{ end }}
  </a>
  <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
  <label for="nav-toggle" class="nav-burger" aria-label="Menu"><span></span><span></span><span></span></label>
  <nav class="site-nav" aria-label="Primary">
    {{ range site.Menus.main }}
      <a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
    <a class="nav-call" href="tel:{{ $s.contact.phone_tel }}">Call Now</a>
  </nav>
</header>
