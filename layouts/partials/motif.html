{{- /* A simple flame/fire-line divider. */ -}}
<div class="motif" aria-hidden="true">
  <svg width="100%" height="16" viewBox="0 0 120 16" preserveAspectRatio="none">
    <defs>
      <pattern id="flame" width="20" height="16" patternUnits="userSpaceOnUse">
        <path d="M2 15 C2 9 8 9 8 4 C8 9 14 9 14 15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </pattern>
    </defs>
    <rect width="120" height="16" fill="url(#flame)"/>
  </svg>
</div>
